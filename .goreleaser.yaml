# Builds the release binaries. Run by .github/workflows/release.yml when a
# version tag is pushed. To try it locally without publishing:
#
#   goreleaser release --snapshot --clean
version: 2

project_name: txball

builds:
  - main: ./cmd/txball
    binary: txball
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^CI:"
